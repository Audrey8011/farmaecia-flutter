name: farma_ecia_flutter
description: Aplicativo Farma&Cia para mobile e web, integrado à API e com catálogo offline.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  connectivity_plus: 6.1.4
  flutter:
    sdk: flutter
  http: ^1.3.0
  path: 1.9.1
  sqflite: 2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/pharmacy_logo.png
    - assets/images/banner_farma_cia.jpeg
    - assets/images/produtos/
